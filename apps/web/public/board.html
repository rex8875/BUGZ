<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bug dashboard</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css" />
</head>
<body>
  <script src="/theme.js"></script>
  <div id="server-rail"></div>
  <div class="container">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <img id="server-avatar" class="server-avatar" style="display:none;width:38px;height:38px;" alt="" />
        <h1 id="server-name">Loading…</h1>
      </div>
      <div>
        <a href="" id="leaderboard-link"><button><i data-lucide="trophy"></i> Leaderboard</button></a>
        <a href="" id="roles-link" style="display:none;"><button><i data-lucide="shield"></i> Roles & members</button></a>
        <button id="customize-btn" style="display:none;"><i data-lucide="palette"></i> Customize</button>
        <button id="settings-btn" style="display:none;"><i data-lucide="settings"></i> Settings</button>
        <a href="/dashboard"><button><i data-lucide="layout-grid"></i> All servers</button></a>
      </div>
    </div>

    <div id="error" class="error-banner" style="display:none;"></div>
    <div id="summary-strip" class="hint" style="margin-bottom:14px;"></div>

    <div id="customize-panel" style="display:none;"></div>
    <div id="settings-panel" class="detail-panel" style="display:none;"></div>

    <div class="search-bar-group">
      <div class="search-input-wrap">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search title/description, or use before:2024-01-01 on:2024-01-01 after:2024-01-01 by:username device:PC"
          autocomplete="off"
        />
        <div id="search-suggest" class="search-suggest" style="display:none;"></div>

  <div id="confirm-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 id="confirm-modal-title"></h3>
      <p id="confirm-modal-text" class="hint"></p>
      <div class="modal-actions">
        <button id="confirm-modal-cancel">Cancel</button>
        <button id="confirm-modal-confirm"></button>
      </div>
    </div>
  </div>
      </div>
      <div class="hint" id="search-hint" style="margin-top:6px;"></div>
    </div>

    <div class="filter-group" id="filters"></div>
    <div class="filter-group" id="priority-filters"></div>
    <div class="report-list" id="report-list"><span class="loading-pulse">Loading…</span></div>
    <div class="pagination-bar" id="pagination"></div>
  </div>
  <script src="https://unpkg.com/lucide@1.30.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
  <script src="/colorPicker.js"></script>
  <script src="/serverRail.js"></script>
  <script src="/board.js"></script>
</body>
</html>
